<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>Folder Viewer</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

<script>
  // configure pdf.js worker
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
</script>

<style>
body{font-family:sans-serif}
button{margin:4px}
table{border-collapse:collapse}
td{border:1px solid #ccc;padding:4px}
</style>

</head>
<body>

<h2>Files</h2>
<div id="filelist"></div>

<div id="viewer"></div>

<script>

//-- initialisation and file loading --//

//-- global state --//

const app_state = {
  "edited_sheets": {}
};

//-- initialisation and file loading --//

async function load_files() {
  const opt = {
    "verbose": true
  };

  const res = await fetch("/list");
  const files = await res.json();

  const list = document.getElementById("filelist");
  list.innerHTML = "";

  if (opt.verbose) {
    console.log("retrieved file list");
  }

  files.forEach(name => {
    const btn = document.createElement("button");
    btn.textContent = name;

    const lower = name.toLowerCase();

    if (lower.endsWith(".pdf")) {
      btn.onclick = () => open_pdf(name);
    }
    else if (lower.endsWith(".xlsx") || lower.endsWith(".xls") || lower.endsWith(".csv")) {
      btn.onclick = () => open_sheet(name);
    }
    else {
      btn.onclick = () => window.open("/files/" + name);
    }

    list.appendChild(btn);
  });
}

//-- pdf handling --//

async function open_pdf(name) {
  const opt = {
    "scale": 1.5,
    "verbose": true
  };

  const url = "/files/" + name;

  if (opt.verbose) {
    console.log("loading pdf: " + url);
  }

  const pdf = await pdfjsLib.getDocument(url).promise;
  const viewer = document.getElementById("viewer");
  viewer.innerHTML = "";

  for (let page_num = 1; page_num <= pdf.numPages; page_num++) {
    const page = await pdf.getPage(page_num);
    const viewport = page.getViewport({ "scale": opt.scale });

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = viewport.width;
    canvas.height = viewport.height;
    canvas.style.display = "block";
    canvas.style.marginBottom = "10px";

    viewer.appendChild(canvas);

    await page.render({
      "canvasContext": ctx,
      "viewport": viewport
    }).promise;
  }
}

//-- sheet handling --//

async function open_sheet(name) {
  const opt = {
    "header": 1,
    "verbose": true
  };

  let data;

  if (app_state["edited_sheets"][name]) {
    if (opt.verbose) {
      console.log("loading sheet from local state: " + name);
    }
    data = app_state["edited_sheets"][name];
  } else {
    if (opt.verbose) {
      console.log("fetching sheet from server: " + name);
    }
    const res = await fetch("/files/" + name);
    const buf = await res.arrayBuffer();

    const wb = XLSX.read(buf);
    const sheet = wb.Sheets[wb.SheetNames[0]];

    data = XLSX.utils.sheet_to_json(sheet, { "header": opt.header });
    
    app_state["edited_sheets"][name] = data;
  }

  render_table(name, data);
}

//-- table rendering and binding --//

function render_table(name, data) {
  const opt = {
    "verbose": true
  };

  let html = "<table>";

  data.forEach((row, r_idx) => {
    html += "<tr>";
    row.forEach((cell, c_idx) => {
      html += `<td contenteditable="true" data-row="${r_idx}" data-col="${c_idx}">${cell ?? ""}</td>`;
    });
    html += "</tr>";
  });

  html += "</table>";

  const btn_save = document.createElement("button");
  btn_save.textContent = "Save to Server";
  btn_save.onclick = () => save_sheet(name);

  const viewer = document.getElementById("viewer");
  viewer.innerHTML = "";
  viewer.appendChild(btn_save);

  const table_container = document.createElement("div");
  table_container.innerHTML = html;
  viewer.appendChild(table_container);

  const cells = table_container.querySelectorAll("td");
  cells.forEach(cell => {
    cell.addEventListener("input", function() {
      const r = this.getAttribute("data-row");
      const c = this.getAttribute("data-col");
      app_state["edited_sheets"][name][r][c] = this.innerText;
      
      if (opt.verbose) {
          console.log("updated cell [" + r + "," + c + "] in state");
      }
    });
  });
}

//-- sheet saving --//

async function save_sheet(original_name) {
  const opt = {
    "book_type": "xlsx",
    "type": "array",
    "verbose": true
  };

  if (opt.verbose) {
    console.log("transmitting edited sheet to server: " + original_name);
  }

  const ws = XLSX.utils.aoa_to_sheet(app_state["edited_sheets"][original_name]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
  
  const wb_out = XLSX.write(wb, { "bookType": opt.book_type, "type": opt.type });

  const res = await fetch("/files/" + original_name, {
    method: "POST",
    headers: {
      "Content-Type": "application/octet-stream"
    },
    body: wb_out
  });

  if (res.ok) {
    if (opt.verbose) {
      console.log("server acknowledged write operation.");
    }
    alert("File successfully overwritten on server.");
  } else {
    if (opt.verbose) {
      console.error("server rejected write operation.");
    }
    alert("Failed to save file.");
  }
}

// execute initial load
load_files();

</script>

</body>
</html>
